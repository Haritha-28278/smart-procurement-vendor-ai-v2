services:
  db:
    image: postgres:16-alpine
    container_name: smart_procure_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_procurement
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_procurement"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: smart_procure_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smart_procurement
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-your_claude_api_key_here}
      JWT_SECRET: ${JWT_SECRET:-super-secret-procurement-jwt-key-2025}
      PORT: 8000
    ports:
      - "8000:8000"

volumes:
  pgdata:
    driver: local
