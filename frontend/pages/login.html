<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Procurement Vendor AI</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-bg">

  <div class="auth-card">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center brand-icon mb-2 mx-auto" style="width: 50px; height: 50px; font-size: 1.5rem;">
        <i class="bi bi-robot"></i>
      </div>
      <h3 class="fw-bold text-dark mt-2 mb-1">Smart Procurement AI</h3>
      <p class="text-muted small">Intelligent Claude-Powered Vendor Selection & RFQ Intelligence</p>
    </div>

    <!-- Quick Demo Accounts -->
    <div class="mb-4 p-3 bg-light rounded-3 border">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="small fw-semibold text-secondary"><i class="bi bi-key-fill text-warning me-1"></i> Quick Demo Logins</span>
        <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.7rem;">Password: password123</span>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="demo-account-btn flex-fill text-center" onclick="fillDemo('admin@smartprocure.ai', 'Admin')">
          <i class="bi bi-shield-check text-primary me-1"></i> Admin
        </button>
        <button type="button" class="demo-account-btn flex-fill text-center" onclick="fillDemo('manager@smartprocure.ai', 'Manager')">
          <i class="bi bi-briefcase text-success me-1"></i> Procurement
        </button>
        <button type="button" class="demo-account-btn flex-fill text-center" onclick="fillDemo('vendor@apexlogistics.com', 'Vendor')">
          <i class="bi bi-truck text-info me-1"></i> Vendor
        </button>
      </div>
    </div>

    <!-- Tabs: Sign In / Sign Up -->
    <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-2 border" id="authTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active py-2 fw-semibold" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Sign In</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link py-2 fw-semibold" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">Create Account</button>
      </li>
    </ul>

    <!-- Tab Contents -->
    <div class="tab-content" id="authTabsContent">
      <!-- Sign In Form -->
      <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Work Email</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" id="loginEmail" class="form-control" placeholder="name@company.com" required value="admin@smartprocure.ai">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required value="password123">
            </div>
          </div>
          <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
            <span>Sign In to Workspace</span>
            <i class="bi bi-arrow-right"></i>
          </button>
        </form>
      </div>

      <!-- Sign Up Form -->
      <div class="tab-pane fade" id="register-pane" role="tabpanel">
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Full Name</label>
            <input type="text" id="regFullName" class="form-control" placeholder="e.g. Eleanor Vance" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Work Email</label>
            <input type="email" id="regEmail" class="form-control" placeholder="eleanor@company.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Account Role</label>
            <select id="regRole" class="form-select" required>
              <option value="Procurement Manager">Procurement Manager (Create RFQs & Evaluate)</option>
              <option value="Admin">Admin (Full System Access)</option>
              <option value="Vendor">Vendor (Submit Proposals & Quotes)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
          </div>
          <button type="submit" id="registerBtn" class="btn btn-dark w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
            <span>Register Account</span>
            <i class="bi bi-person-check"></i>
          </button>
        </form>
      </div>
    </div>

    <!-- Security & Model Attribution footer -->
    <div class="mt-4 pt-3 border-top text-center">
      <span class="badge ai-badge mb-1"><i class="bi bi-stars"></i> Powered by Claude AI</span>
      <p class="text-muted" style="font-size: 0.72rem; margin: 0;">256-bit JWT Encryption • PostgreSQL Raw SQL Architecture</p>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- API Client JS -->
  <script src="/js/api.js"></script>

  <script>
    // Autofill helper
    function fillDemo(email, label) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = 'password123';
      showToast(`Selected demo account: ${label}`, "info");
    }

    // Check if session expired query param exists
    if (new URLSearchParams(window.location.search).get('session') === 'expired') {
      showToast("Your session has expired. Please sign in again.", "warning");
    }

    // Login Form Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      try {
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status"></span>Signing in...`;
        await api.auth.login(email, password);
        showToast("Signed in successfully! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "/pages/dashboard.html";
        }, 600);
      } catch (err) {
        showToast(err.message || "Failed to sign in. Please verify credentials.", "error");
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In to Workspace</span><i class="bi bi-arrow-right"></i>`;
      }
    });

    // Register Form Submit
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const role = document.getElementById('regRole').value;
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('registerBtn');

      try {
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status"></span>Creating account...`;
        await api.auth.register(email, password, full_name, role);
        showToast("Account created successfully! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "/pages/dashboard.html";
        }, 600);
      } catch (err) {
        showToast(err.message || "Registration failed.", "error");
        btn.disabled = false;
        btn.innerHTML = `<span>Register Account</span><i class="bi bi-person-check"></i>`;
      }
    });
  </script>
</body>
</html>
